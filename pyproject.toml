[project]
name = "business-matcher-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tara M A", email = "mandyamtara@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "pydantic>=2.14.4",
